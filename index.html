<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tagbook Electrical Testing</title>
<meta name="description" content="Test and tag logbook, electrical test certificates and RCD log.">
<meta name="theme-color" content="#1B4FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: single-column field logbook. Sticky header with an earth-wire stripe, fixed five-tab bar, every form in a bottom sheet. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#13202E; --ink-2:#506072; --line:#D3DAE3;
  --accent:#1B4FD6; --on-accent:#FFFFFF; --accent-soft:#E2EAFD;
  --pass:#12703F; --pass-soft:#DCF2E5; --fail:#B8261B; --fail-soft:#FBE2DF; --due:#8A5600; --due-soft:#FBEDC9;
  --earth-g:#1E8C4E; --earth-y:#F3C81C;
  --tag-red:#D2362D; --tag-green:#1F9D57; --tag-blue:#2561E8; --tag-yellow:#F3C81C; --tag-orange:#EF7F1A; --tag-white:#FFFFFF;
  --tag-ink-dark:#13202E; --tag-ink-light:#FFFFFF; --paper:#FFFFFF;
  --scrim:rgba(13,21,31,.5); --shadow:0 1px 2px rgba(19,32,46,.07),0 8px 24px rgba(19,32,46,.07);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D151E; --surface:#16212D; --surface-2:#1C2937; --ink:#E7EDF4; --ink-2:#9DAEC1; --line:#2A3A4B;
  --accent:#86A7FF; --on-accent:#0B1322; --accent-soft:#1B2B4E;
  --pass:#62D49C; --pass-soft:#133526; --fail:#FF8D82; --fail-soft:#42201D; --due:#F1C05A; --due-soft:#3A2E11;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D151E; --surface:#16212D; --surface-2:#1C2937; --ink:#E7EDF4; --ink-2:#9DAEC1; --line:#2A3A4B;
  --accent:#86A7FF; --on-accent:#0B1322; --accent-soft:#1B2B4E;
  --pass:#62D49C; --pass-soft:#133526; --fail:#FF8D82; --fail-soft:#42201D; --due:#F1C05A; --due-soft:#3A2E11;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding-inline:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;color:var(--ink-2);letter-spacing:.05em;margin-top:6px}
p{margin:0}
.muted{color:var(--ink-2)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

#app{max-width:760px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.brand .mark{width:30px;height:38px;border-radius:5px;background:var(--accent);position:relative;flex:none}
.brand .mark::before{content:"";position:absolute;left:50%;top:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg)}
.brand .mark::after{content:"";position:absolute;left:6px;right:6px;bottom:8px;height:10px;border-top:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pass);flex:none}
.sync[data-s="saving"] i{background:var(--due)} .sync[data-s="local"] i{background:var(--due)} .sync[data-s="error"] i{background:var(--fail)}
.stripe{height:5px;margin-inline:-16px;background:repeating-linear-gradient(115deg,var(--earth-g) 0 22px,var(--earth-y) 22px 32px)}

main{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{background:var(--due-soft);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
.banner.info{background:var(--accent-soft)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-data);font-weight:600;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-2);line-height:1.2}
.stat.bad b{color:var(--fail)} .stat.warn b{color:var(--due)}
@media (max-width:520px){ .stats{grid-template-columns:repeat(2,1fr)} }

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){ .quick{grid-template-columns:1fr} }

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 16px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--fail)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);border-radius:28px;padding-inline:20px}

.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:14px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.group{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.row .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .main b{font-weight:600;overflow-wrap:anywhere}
.row .main span{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tag{width:58px;min-height:44px;border-radius:6px 6px 6px 6px;padding:13px 4px 5px;position:relative;font-family:var(--f-data);font-size:11px;font-weight:600;text-align:center;line-height:1.15;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.tag::before{content:"";position:absolute;left:50%;top:4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.tag.red{background:var(--tag-red);color:var(--tag-ink-light);border-color:var(--tag-red)}
.tag.green{background:var(--tag-green);color:var(--tag-ink-light);border-color:var(--tag-green)}
.tag.blue{background:var(--tag-blue);color:var(--tag-ink-light);border-color:var(--tag-blue)}
.tag.yellow{background:var(--tag-yellow);color:var(--tag-ink-dark);border-color:var(--tag-yellow)}
.tag.orange{background:var(--tag-orange);color:var(--tag-ink-dark);border-color:var(--tag-orange)}
.tag.white{background:var(--tag-white);color:var(--tag-ink-dark)}
.pill{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.pass{background:var(--pass-soft);color:var(--pass)} .pill.fail{background:var(--fail-soft);color:var(--fail)} .pill.due{background:var(--due-soft);color:var(--due)}
.pill.ex{background:var(--accent-soft);color:var(--accent)}

.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-data);font-weight:600;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2);min-height:60px;border-top:3px solid transparent}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:none}
dialog::backdrop{background:var(--scrim)}
.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:680px;margin:0 auto;max-height:92%;border-radius:16px 16px 0 0;overflow:hidden}
.sheet[open]{display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet .body{overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.x{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;flex:none}
@media (min-width:720px){ .sheet{inset:0;margin:auto;height:fit-content;border-radius:14px} }
.confirm{margin:auto;border-radius:14px;width:min(420px,calc(100% - 32px));padding:20px}
.confirm[open]{display:flex;flex-direction:column;gap:16px}
.confirm div{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;margin:0}
.fld>span,.fld>legend{font-size:14px;font-weight:600;color:var(--ink-2);padding:0}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
.fld .unit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px}
.fld .unit input{border:0;background:none;font-family:var(--f-data);outline:none}
.fld .unit:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.fld .unit em{font-style:normal;font-family:var(--f-data);font-size:14px;color:var(--ink-2);padding-right:12px}
.fld small{font-size:13px;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:440px){ .row3{grid-template-columns:1fr 1fr} }
.segrow{display:flex;gap:8px;flex-wrap:wrap}
.segrow label{flex:1 1 0;min-width:72px;position:relative}
.segrow input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.segrow span{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:46px;padding:8px;font-weight:600;font-size:15px;text-align:center}
.segrow input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segrow label.p input:checked+span{background:var(--pass);border-color:var(--pass);color:var(--surface)}
.segrow label.f input:checked+span{background:var(--fail);border-color:var(--fail);color:var(--surface)}
.segrow input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.segrow input:disabled+span{opacity:.4}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);flex:none}
.quickvals{display:flex;gap:6px;flex-wrap:wrap}
.quickvals button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-family:var(--f-data);font-size:13px;min-height:32px}
.verdict{border-radius:8px;padding:10px 12px;font-size:15px;background:var(--surface-2);color:var(--ink-2)}
.verdict.pass{background:var(--pass-soft);color:var(--pass)} .verdict.fail{background:var(--fail-soft);color:var(--fail)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.hint{font-size:14px;color:var(--ink-2)}
.warn{font-size:14px;color:var(--fail);font-weight:600}

.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.dl div{display:flex;flex-direction:column;gap:1px;min-width:0}
.dl dt{font-size:13px;color:var(--ink-2)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.readings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.reading{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.reading span{font-size:12px;color:var(--ink-2)}
.reading b{font-family:var(--f-data);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.hist .h .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.circuit{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.circuit .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .row{grid-template-columns:minmax(0,1fr) auto}
.pad{background:var(--paper);border:1px solid var(--line);border-radius:8px;width:100%;height:150px;touch-action:none;display:block}
.logo{max-height:64px;max-width:200px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){ .sheet[open]{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span>Tagbook</div>
      <div class="sync" id="sync" data-s="saving"><i></i><span>Opening your records</span></div>
    </div>
    <div class="stripe" aria-hidden="true"></div>
  </div>
  <main id="view"><div class="empty"><p>Opening your logbook.</p></div></main>
</div>

<nav class="tabs" aria-label="Sections"><div>
  <button class="tab" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button class="tab" data-act="tab" data-tab="tag"><svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><circle cx="12" cy="7" r="1.4"/><path d="M9 13h6M9 16.5h6"/></svg>Test &amp; tag</button>
  <button class="tab" data-act="tab" data-tab="certs"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12l2 2 4-4M9 17.5h6"/></svg>Certificates</button>
  <button class="tab" data-act="tab" data-tab="rcd"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M12 7v5M9.5 16h5"/><circle cx="12" cy="12" r="0.4"/></svg>RCDs</button>
  <button class="tab" data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>More</button>
</div></nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <header><h2 id="sheetTitle"></h2><button class="x" data-act="closeSheet" aria-label="Close">&times;</button></header>
  <div class="body" id="sheetBody"></div>
</dialog>
<dialog class="confirm" id="confirm"><p id="confirmMsg"></p><div><button class="btn" data-act="confirmNo">Cancel</button><button class="btn primary" id="confirmOk" data-act="confirmYes">OK</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="pdf-lib.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => iso(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const validD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const addMonths = (s, n) => {
  const d = parseD(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + Number(n));
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return iso(d);
};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = s => { if (!validD(s)) return '—'; const d = parseD(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const daysTo = s => Math.round((parseD(s) - parseD(today())) / 864e5);
const val = s => { const m = String(s ?? '').replace(',', '.').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const clone = o => JSON.parse(JSON.stringify(o));
const byName = (a, b) => String(a.name).localeCompare(String(b.name));

/* ---------- reference data ---------- */
// Typical retest intervals in months. pf/pp = RCD push-button (fixed/portable, 0 = before each use), tf/tp = RCD trip-time test.
const ENVS = [
  { k: 'construction', n: 'Construction or demolition site', m: 3, pf: 1, pp: 0, tf: 12, tp: 3 },
  { k: 'factory', n: 'Factory, workshop or manufacturing', m: 6, pf: 6, pp: 0, tf: 12, tp: 12 },

const Store = {

  async init() {

        [db, user, Cap.downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
      }

  },
  coll(name) { return this.root.collection(name); },
  async loadColl(name) {
    if (this.mode === 'local') { try { return Object.values(JSON.parse(localStorage.getItem('tagbook:' + name) || '{}')); } catch (e) { return []; } }
    const out = []; let last = null;
    for (let i = 0; i < 60; i++) {
      const q = last === null ? this.coll(name).orderBy('id').limit(500) : this.coll(name).where('id', '>', last).orderBy('id').limit(500);
      const snap = await q.get();

  async loadAll() {
    const [clients, items, rcds, certs, meta] = await Promise.all(['clients', 'items', 'rcds', 'certs', 'meta'].map(n => this.loadColl(n)));

  write(name, id, data) {

    + (rows.length > 300 ? `<p class="muted">Showing the first 300. Narrow the list with a site or search.</p>` : '');
}
function vCerts() {
  const list = [...S.certs].sort((a, b) => String(b.dateTested).localeCompare(String(a.dateTested)) || String(b.number).localeCompare(String(a.number)));
  let h = `<div class="head"><div><h1>Certificates</h1><p class="muted">${list.length} on file</p></div></div>`;
  if (!list.length) h += `<div class="empty"><p><b>No certificates yet.</b><br>Record the tests for a job, sign it off and download a PDF to give your customer.</p><button class="btn primary" data-act="newCert">New certificate</button></div>`;
  else h += `<div class="list">` + list.map(c => `<button class="row" data-act="openCert" data-id="${c.id}">${tagChip('', c.number)}<span class="main"><b>${esc(c.clientName || 'No name yet')}${exPill(c)}</b><span>${esc([CERT_SHORT[c.type], c.siteAddress].filter(Boolean).join(' · '))}</span></span><span class="side"><span class="pill ${c.status === 'issued' ? 'pass' : 'due'}">${c.status === 'issued' ? 'Issued' : 'Draft'}</span><span class="num">${fmt(c.dateTested)}</span></span></button>`).join('') + '</div>';
  return h + `<button class="btn primary fab" data-act="newCert">+ Certificate</button>`;
}
function vRcd() {
  const list = S.rcds.filter(inSite).map(r => ({ r, st: rcdStatus(r) })).sort((a, b) => a.st.rank - b.st.rank || String(rcdDue(a.r) || '9').localeCompare(String(rcdDue(b.r) || '9')));
  let h = `<div class="head"><div><h1>RCD log</h1><p class="muted">${list.length} of ${S.rcds.length} RCD${S.rcds.length === 1 ? '' : 's'}</p></div></div>`;
  if (S.rcds.length) h += `<div class="filters">${siteFilter()}</div><div class="actions"><button class="btn small" data-act="csvRcds">RCD log CSV</button></div>`;
  if (!S.rcds.length) h += `<div class="empty"><p><b>No RCDs logged yet.</b><br>Add each safety switch once, then record its push-button and trip-time tests.</p><button class="btn primary" data-act="newRcd">Log an RCD</button></div>`;
  else if (!list.length) h += `<div class="empty"><p>No RCDs at this site.</p></div>`;
  else h += `<div class="list">` + list.map(({ r, st }) => { const lt = (r.tests || [])[0]; const ms = lt ? [lt.t0, lt.t180].filter(x => x !== '' && x != null).join(' / ') : ''; return `<button class="row" data-act="openRcd" data-id="${r.id}">${tagChip('', `${r.rating}mA`)}<span class="main"><b>${esc(r.ref)}${exPill(r)}</b><span>${esc([r.board, whereOf(r)].filter(Boolean).join(' · '))}</span></span><span class="side">${pill(st)}<span class="num">${ms ? esc(ms) + ' ms' : ''}</span></span></button>`; }).join('') + '</div>';
  return h + `<button class="btn primary fab" data-act="newRcd">+ RCD</button>`;
}

/* ---------- More: clients, business, instruments, limits, data ---------- */

        : `<div class="empty"><p>Add your tester so its make, serial number and calibration date are recorded against each test.</p></div>`);
  }

      <div class="row2">${F.num('leak1', 'Leakage, Class I max', L.leak1, 'mA')}${F.num('leak2', 'Leakage, Class II max', L.leak2, 'mA')}</div>

    <div class="card"><dl class="dl"><div><dt>Clients</dt><dd class="num">${S.clients.length}</dd></div><div><dt>Appliances</dt><dd class="num">${S.items.length}</dd></div><div><dt>RCDs</dt><dd class="num">${S.rcds.length}</dd></div><div><dt>Test records</dt><dd class="num">${tests}</dd></div><div><dt>Certificates</dt><dd class="num">${S.certs.length}</dd></div><div><dt>Stored</dt><dd>${Store.mode === 'cloud' ? 'In your account, private to your login' : 'In this browser only'}</dd></div></dl></div>

    <div class="card"><h2>Restore</h2><p class="muted">Load a Tagbook backup file, for example when you move to a new phone. Records with the same ID are replaced, everything else is kept.</p>
      <div class="actions"><label class="btn" for="restoreFile">Choose a backup file</label><input id="restoreFile" type="file" accept="application/json,.json" data-change="restore" hidden></div></div>`;
  }

  return `<div class="head"><h1>More</h1></div><div class="menu">
    ${row('clients', 'Clients and sites', `${S.clients.length} client${S.clients.length === 1 ? '' : 's'}`)}

    ${row('data', 'Your data', 'Exports and backup')}</div>

}

    ${siteSelect(i.clientId, i.siteId)}

    ${F.text('desc', 'Appliance', i.desc, { attrs: 'placeholder="Angle grinder 125 mm"' })}

    ${F.select('cls', 'Type', i.cls, Object.entries(CLS))}
    ${F.select('env', 'Where it is used', i.env, ENVS.map(e => [e.k, `${e.n} (${e.m} months)`]), 'data-change="envSel"')}

    ${F.text('nextDue', 'Retest due', addMonths(d, i.interval), { type: 'date', help: `${i.interval} months from the test date. Change it if you need to.` })}

    ${F.select('action', 'If it failed, what happened to it', '', [['', 'Not applicable'], ['Removed from service and tagged out', 'Removed from service and tagged out'], ['Sent for repair', 'Sent for repair'], ['Disposed of', 'Disposed of'], ['Returned to owner as failed', 'Returned to owner as failed']])}

function loadLogo(file) {

const fileSafe = s => String(s || '').replace(/[^A-Za-z0-9 _.-]/g, '').trim().slice(0, 80) || 'tagbook';

    const url = URL.createObjectURL(new Blob([data], { type })), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

  }

}

/* ---------- form submits ---------- */
const submit = {
  item(fd, form, go) {
    const i = W.item, site = resolveSite(fd);
    if (!site) return formErr(form, 'Choose a client and site, or type the new names.');
    if (!fd.desc) return formErr(form, 'Say what the appliance is.');
    if (!fd.assetId) return formErr(form, 'Give it an asset ID. This is the number written on the tag.');
    if (S.items.some(x => x.id !== i.id && x.assetId.toLowerCase() === fd.assetId.toLowerCase())) return formErr(form, `Asset ID ${fd.assetId} is already used. Each appliance needs its own.`);
    const iv = val(fd.interval); if (!iv) return formErr(form, 'Enter how many months between retests.');
    Object.assign(i, site, { assetId: fd.assetId, desc: fd.desc, make: fd.make, serial: fd.serial, location: fd.location, cls: fd.cls, env: fd.env, interval: iv });
    if (i.status === 'pass' && validD(i.lastTest)) i.nextDue = addMonths(i.lastTest, iv);
    save('items', i); S.settings.lastEnv = i.env; saveSettings();
    render();
    if (go === 'test') { W = { item: i }; openSheet('Record a test', testForm(i)); } else { closeSheet(); toast('Appliance saved'); }
  },
  itemTest(fd, form, go) {
    const i = W.item, ev = evalItem(i.cls, fd, S.settings.lim);
    if (!validD(fd.date)) return formErr(form, 'Enter the date tested.');
    const result = ev.fail.length ? 'fail' : fd.result;
    if (!result) return formErr(form, 'Choose Pass or Fail.');
    if (result === 'pass' && ev.miss.length) return formErr(form, 'To pass it still needs: ' + ev.miss.join(', ') + '.');
    if (result === 'pass' && !validD(fd.nextDue)) return formErr(form, 'Enter the retest due date.');
    const t = { id: uid(), date: fd.date, visual: fd.visual || '', earth: fd.earth || '', ir: fd.ir || '', leak: fd.leak || '', polarity: fd.polarity || '', result, tag: result === 'pass' ? (fd.tag || '') : '', nextDue: result === 'pass' ? fd.nextDue : '', tester: fd.tester, instrument: fd.instrument, action: result === 'fail' ? fd.action : '', notes: fd.notes };
    i.tests = [t, ...(i.tests || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const latest = i.tests[0];
    Object.assign(i, { status: latest.result, lastTest: latest.date, nextDue: latest.nextDue, tagColour: latest.result === 'pass' ? latest.tag : '' });
    save('items', i); S.settings.lastTag = fd.tag || S.settings.lastTag; if (fd.tester && !S.settings.tester) S.settings.tester = fd.tester; saveSettings();
    render();
    if (go === 'next') { startItem({ clientId: i.clientId, siteId: i.siteId, location: i.location, env: i.env, interval: i.interval, cls: i.cls }); toast(`${i.assetId} saved as ${result === 'pass' ? 'a pass' : 'a fail'}`); }
    else { closeSheet(); toast(result === 'pass' ? `Passed. Retest due ${fmt(t.nextDue)}` : 'Saved as failed'); }
  },
  rcd(fd, form, go) {
    const r = W.rcd, site = resolveSite(fd);
    if (!site) return formErr(form, 'Choose a client and site, or type the new names.');
    if (!fd.ref) return formErr(form, 'Give the RCD a name or number.');
    const tm = val(fd.timeMonths); if (!tm) return formErr(form, 'Enter how many months between trip-time tests.');
    Object.assign(r, site, { ref: fd.ref, board: fd.board, circuit: fd.circuit, rating: fd.rating, kind: fd.kind, env: fd.env, pushMonths: val(fd.pushMonths) || 0, timeMonths: tm });
    if (validD(r.lastPush)) r.nextPush = r.pushMonths ? addMonths(r.lastPush, r.pushMonths) : '';
    if (validD(r.lastTime)) r.nextTime = addMonths(r.lastTime, r.timeMonths);
    save('rcds', r); render();
    if (go === 'test') { W = { rcd: r }; openSheet('Record an RCD test', rcdTestForm(r)); } else { closeSheet(); toast('RCD saved'); }
  },
  rcdTest(fd, form) {
    const r = W.rcd, ev = evalRcd(r, fd);
    if (!validD(fd.date)) return formErr(form, 'Enter the date tested.');
    if (!ev.done) return formErr(form, 'Record a push-button test, a trip time, or both.');
    const t = { id: uid(), date: fd.date, push: fd.push || '', t0: fd.t0 || '', t180: fd.t180 || '', noTrip: !!fd.noTrip, result: ev.fail.length ? 'fail' : 'pass', tester: fd.tester, instrument: fd.instrument, notes: fd.notes };
    r.tests = [t, ...(r.tests || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const lp = r.tests.find(x => x.push), lt = r.tests.find(x => x.t0 || x.t180 || x.noTrip);
    r.status = r.tests[0].result; r.lastPush = lp ? lp.date : ''; r.lastTime = lt ? lt.date : '';
    r.nextPush = lp && Number(r.pushMonths) ? addMonths(lp.date, r.pushMonths) : '';
    r.nextTime = lt ? addMonths(lt.date, r.timeMonths) : '';
    save('rcds', r); if (fd.tester && !S.settings.tester) { S.settings.tester = fd.tester; saveSettings(); }
    render(); closeSheet(); toast(t.result === 'pass' ? 'RCD passed' : 'RCD saved as failed');
  },
  cert(fd, form, go) {
    const c = readCert(form), s = S.settings;
    if (!c.number) return formErr(form, 'Give the certificate a number.');
    if (S.certs.some(x => x.id !== c.id && x.number === c.number)) return formErr(form, `Certificate number ${c.number} is already used.`);
    if (go === 'issue') {
      const need = [];
      if (!c.clientName) need.push('the name of the person the work was done for');
      if (!c.clientAddress) need.push('their address');
      if (!c.workDesc) need.push('details of what was tested');
      if (!validD(c.dateTested)) need.push('the date tested');
      if (!c.signedBy) need.push('who tested and certified it');
      if (need.length) return formErr(form, 'Before issuing, add ' + need.join(', ') + '.');
      if (c.type !== 'report' && !s.contractorLic) return formErr(form, 'This certificate must show an electrical contractor licence number. Add it under More, Business details, or issue it as a test report only.');
      c.status = 'issued'; c.dateIssued = today();
    }
    if (W.provisional && c.number === W.provisional && !S.certs.some(x => x.id === c.id)) { s.certNext = (Number(s.certNext) || 1) + 1; saveSettings(); }
    W.provisional = '';
    save('certs', clone(c)); render();
    if (go === 'pdf') { certPdf(c); $('#sheetTitle').textContent = 'Certificate ' + c.number; $('#sheetBody').innerHTML = certForm(c); toast('Draft saved'); return; }
    if (go === 'issue') { W = {}; openSheet('Certificate ' + c.number, certSummary(c)); toast('Certificate issued'); return; }
    closeSheet(); toast('Draft saved');
  },
  client(fd, form) {
    const c = readClient(form);
    if (!c.name) return formErr(form, 'Enter the client name.');
    if (c.sites.some(s => !s.name)) return formErr(form, 'Give every site a name.');
    save('clients', clone(c)); closeSheet(); render(); toast('Client saved');
  },
  inst(fd, form) {
    if (!fd.name) return formErr(form, 'Enter the make and model.');
    const i = Object.assign(W.inst, { name: fd.name, serial: fd.serial, cal: fd.cal }), a = S.settings.instruments, n = a.findIndex(x => x.id === i.id);
    if (n < 0) a.push(i); else a[n] = i;
    saveSettings(); closeSheet(); render(); toast('Instrument saved');
  },
  business(fd) { ['biz', 'abn', 'addr', 'phone', 'email', 'contractorLic', 'tester', 'testerLic'].forEach(k => { S.settings[k] = fd[k] || ''; }); saveSettings(); toast('Business details saved'); },
  limits(fd, form) {
    const L = {}; for (const k of ['earth', 'ir', 'leak1', 'leak2', 'rcd30', 'rcd10']) { const v = val(fd[k]); if (v === null) return formErr(form, 'Every limit needs a number.'); L[k] = v; }
    Object.assign(S.settings, { lim: L, assetPrefix: fd.assetPrefix || '', certPrefix: fd.certPrefix || '', certNext: Math.max(1, Math.round(val(fd.certNext) || 1)) });
    formErr(form, ''); saveSettings(); toast('Saved');
  },
};

/* ---------- live form feedback ---------- */
const live = {
  itemTest(form, e) {
    const fd = formData(form), i = W.item, ev = evalItem(i.cls, fd, S.settings.lim), v = $('#verdict', form);
    const pass = $('#f-result-pass', form), fail = $('#f-result-fail', form);
    if (e && e.target.name === 'result') form.dataset.touched = '1';
    if (e && e.target.name === 'nextDue') form.dataset.dueTouched = '1';
    if (e && e.target.name === 'date' && validD(fd.date)) {
      if (!form.dataset.dueTouched) $('#f-nextDue', form).value = addMonths(fd.date, i.interval);
      if (i.env === 'construction') { const r = $('#f-tag-' + seasonTag(fd.date), form); if (r) r.checked = true; }
    }
    pass.disabled = ev.fail.length > 0;
    if (ev.fail.length) { fail.checked = true; v.className = 'verdict fail'; v.textContent = 'Fail: ' + ev.fail.join('; ') + '.'; }
    else if (ev.miss.length) { v.className = 'verdict'; v.textContent = 'Still needed: ' + ev.miss.join(', ') + '.'; if (!form.dataset.touched) { pass.checked = false; fail.checked = false; } }
    else { v.className = 'verdict pass'; v.textContent = 'All readings are within the limits.'; if (!form.dataset.touched) pass.checked = true; }
  },
  rcdTest(form) {
    const fd = formData(form), ev = evalRcd(W.rcd, fd), v = $('#verdict', form);
    if (ev.fail.length) { v.className = 'verdict fail'; v.textContent = 'Fail: ' + ev.fail.join('; ') + '.'; }
    else if (ev.done) { v.className = 'verdict pass'; v.textContent = ev.timed ? `Pass. Trip time is within ${rcdLimit(W.rcd)} ms.` : 'Pass on the push-button test. No trip time recorded.'; }
    else { v.className = 'verdict'; v.textContent = 'Record a push-button test, a trip time, or both.'; }
  },
  cert(form, e) {
    if (!e || e.target.name !== 'type') return;
    const t = e.target.value, st = $('#f-statement', form);
    $('#certHint', form).textContent = CERT_HINT[t];
    if (Object.values(STATEMENT).includes(st.value.trim()) || !st.value.trim()) st.value = STATEMENT[t];
  },
};
const change = {
  siteSel(el) { const box = $('#newSite'), v = el.value, show = v === '__new' || v.endsWith('|__new'); box.hidden = !show; $('#newClientWrap').hidden = v !== '__new'; if (show) (v === '__new' ? $('#f-newClient') : $('#f-newSite')).focus(); },
  envSel(el) {
    const form = el.closest('form'), e = envOf($('#f-env', form).value);
    if ($('#f-interval', form)) $('#f-interval', form).value = e.m;
    if ($('#f-pushMonths', form)) { const port = $('#f-kind', form).value === 'portable'; $('#f-pushMonths', form).value = port ? e.pp : e.pf; $('#f-timeMonths', form).value = port ? e.tp : e.tf; }
  },
  fltSite(el) { S.filter.site = el.value; render(); },
  certPick(el) { const c = clientOf(el.value), form = el.closest('form'); if (!c) return; $('#f-clientName', form).value = c.name; $('#f-clientAddress', form).value = c.address || ''; if (!$('#f-siteAddress', form).value) $('#f-siteAddress', form).value = (c.sites[0] && c.sites[0].address) || c.address || ''; },
  logo(el) { loadLogo(el.files[0]); },
  restore(el) {
    const file = el.files[0]; if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      let d; try { d = JSON.parse(fr.result); } catch (e) { d = null; }
      const names = ['clients', 'items', 'rcds', 'certs'];
      if (!d || !names.some(n => Array.isArray(d[n]))) { toast('That is not a Tagbook backup file.'); return; }
      const n = names.reduce((t, k) => t + (Array.isArray(d[k]) ? d[k].length : 0), 0);
      confirmBox(`Restore ${n} record${n === 1 ? '' : 's'} and the business details from this backup?`, 'Restore', async () => {
        for (const k of names) for (const x of (Array.isArray(d[k]) ? d[k] : [])) {
          if (!x || !x.id) continue;
          const i = S[k].findIndex(y => y.id === x.id); if (i < 0) S[k].push(x); else S[k][i] = x;
          if (Store.mode === 'cloud') { Store.write(k, x.id, x); await Store.queue[k + '/' + x.id]; }
        }
        if (Store.mode === 'local') names.forEach(k => Store.write(k, '', null));
        if (d.settings && typeof d.settings === 'object') { S.settings = Object.assign(clone(DEFAULTS), d.settings, { id: 'settings' }); S.settings.lim = Object.assign(clone(DEFAULTS.lim), d.settings.lim || {}); saveSettings(); }
        render(); toast('Backup restored');
      });
    };
    fr.readAsText(file);
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = act[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
